name: Build Haven Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android-apk.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test and assemble APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          ls -l android/app/build/outputs/apk/debug || true
          find android/app/build/outputs -type f -name "*.apk" -maxdepth 5

      - name: Upload APK artifact
        if: ${{ hashFiles('android/app/build/outputs/apk/debug/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Haven-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-results
          path: android/app/build/reports/tests/
          retention-days: 7
